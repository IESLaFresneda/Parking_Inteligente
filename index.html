<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Parking Inteligente</title>

<style>
body {
  font-family: Arial;
  background: #eef2f7;
  margin: 0;
}

/* CABECERA */
h1 {
  background: #0ea5e9;
  color: white;
  padding: 15px;
  margin: 0;
  text-align: center;
}

/* CONTENEDOR GENERAL */
.container {
  display: flex;
  flex-direction: column;
  gap: 20px;
  padding: 15px;
}

/* TARJETA */
.card {
  background: white;
  border-radius: 20px;
  padding: 25px;
  box-shadow: 0px 5px 12px rgba(0,0,0,0.1);
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* NOMBRE */
.nombre {
  font-size: 22px;
  margin-bottom: 15px;
}

/* CIRCULO RESPONSIVE */
.circulo {
  width: 40vw;
  height: 40vw;
  max-width: 160px;
  max-height: 160px;
  min-width: 120px;
  min-height: 120px;

  border-radius: 50%;
  background: #e2fbe8;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  margin-bottom: 20px;
}

/* NUMERO DE PLAZAS LIBRES */
.plazas {
  font-size: clamp(40px, 8vw, 58px);
  font-weight: bold;
  color: #22c55e;
  line-height: 1;
}

/* TEXTO DEL TOTAL */
.total {
  font-size: clamp(13px, 3vw, 18px);
  color: #16a34a;
  font-weight: 600;
  margin-top: 6px;
}

/* BOTON */
button {
  width: 100%;
  max-width: 300px;
  padding: 15px;
  border-radius: 14px;
  border: none;
  background: #0ea5e9;
  color: white;
  font-size: 18px;
  cursor: pointer;
}

button:active {
  transform: scale(0.97);
}
</style>
</head>

<body>

<h1>🚗 Parking Inteligente</h1>

<div class="container">

  <!-- PARKING 1 -->
  <div class="card">
    <div class="nombre">📍 Escandelera</div>

    <div class="circulo">
      <div id="p1" class="plazas">--</div>
      <div class="total">de 10 plazas</div>
    </div>

    <button onclick="irMapa(43.3835,-5.8129)">
      🧭 Cómo llegar
    </button>
  </div>

  <!-- PARKING 2 -->
  <div class="card">
    <div class="nombre">📍 Plaza San Miguel</div>

    <div class="circulo">
      <div id="p2" class="plazas">--</div>
      <div class="total">de 10 plazas</div>
    </div>

    <button onclick="irMapa(43.3825,-5.8095)">
      🧭 Cómo llegar
    </button>
  </div>

</div>

<script>

// CANALES DE THINGSPEAK
let canal1 = "3350212";
let canal2 = "3385668";

// MAPS
// Esta función mantiene el botón "Cómo llegar"
function irMapa(lat, lon) {
  window.location.href = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}`;
}

// CARGAR DATOS DE THINGSPEAK
async function cargar() {

  try {
    let d1 = await fetch(`https://api.thingspeak.com/channels/${canal1}/fields/1/last.json`).then(r => r.json());
    let v1 = parseInt(d1.field1);

    document.getElementById("p1").innerText = Number.isFinite(v1) ? v1 : "--";

    let d2 = await fetch(`https://api.thingspeak.com/channels/${canal2}/fields/1/last.json`).then(r => r.json());
    let v2 = parseInt(d2.field1);

    document.getElementById("p2").innerText = Number.isFinite(v2) ? v2 : "--";

  } catch(e) {
    console.log("Esperando datos...");
  }
}

// ACTUALIZA CADA 15 SEGUNDOS
setInterval(cargar, 15000);
cargar();

</script>

</body>
</html>
